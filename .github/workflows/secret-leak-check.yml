name: Secret Leak Check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
      - nightly

jobs:
  secret-leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Scan committed files for obvious secrets
        run: bash scripts/check-secret-leaks.sh
