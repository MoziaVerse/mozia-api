version: '3.4'

services:
  mozia-api:
    image: mozia-api
    container_name: mozia-api
    build: .
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3369:3000"
      - "172.16.10.107:3369:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - SQL_DSN=postgresql://mozia_api:api@mozia@postgres-dev:5432/mozia_api_db
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
    depends_on:
      - redis
    networks:
      - mozia-api-network
      - postgres_db_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:latest
    container_name: redis-newapi
    restart: always
    networks:
      - mozia-api-network
      - postgres_db_internal

networks:
  mozia-api-network:
    driver: bridge

  postgres_db_internal:
    external: true
