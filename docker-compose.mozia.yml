version: '3.4'

services:
  mozia-api:
    image: mozia-api
    container_name: mozia-api
    build: .
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${MOZIA_API_BIND_LOCAL:-127.0.0.1:3369}:3000"
      - "${MOZIA_API_BIND_INTERNAL:?set MOZIA_API_BIND_INTERNAL in .env, for example 172.16.x.x:3369}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - SQL_DSN=${SQL_DSN:?set SQL_DSN in .env; never commit real database credentials}
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
    depends_on:
      - redis
    networks:
      - mozia-api-network
      - postgres_db_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:latest
    container_name: redis-newapi
    restart: always
    networks:
      - mozia-api-network
      - postgres_db_internal

networks:
  mozia-api-network:
    driver: bridge

  postgres_db_internal:
    external: true
