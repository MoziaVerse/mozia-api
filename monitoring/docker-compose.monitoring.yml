# ==============================================================================
# Plan A — Standalone Monitoring Server (recommended: 2C4G, 40GB+ disk)
# Runs Prometheus + Alertmanager + Feishu Signed Webhook + Grafana + Uptime Kuma
# completely isolated from the mozia-api business host.
#
# First-time setup:
#   1. cp .env.monitoring.example .env.monitoring && edit .env.monitoring
#   2. ./scripts/render-targets.sh .env.monitoring
#   3. docker compose --env-file .env.monitoring -f docker-compose.monitoring.yml up -d --build
# ==============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mozia-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/targets/prometheus.runtime.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-25GB}"
      - "--web.enable-lifecycle"
    ports:
      - "${MONITORING_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: mozia-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${MONITORING_BIND_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      - feishu-webhook
    networks:
      - monitoring-net
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  feishu-webhook:
    build:
      context: ./feishu-webhook
      dockerfile: Dockerfile
    image: mozia-feishu-webhook:local
    container_name: mozia-feishu-webhook
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8060"
      ALERT_ENV: ${ALERT_ENV:-prod}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:?set FEISHU_WEBHOOK_URL in .env.monitoring}
      FEISHU_SECRET: ${FEISHU_SECRET:-}
      FEISHU_CRITICAL_WEBHOOK_URL: ${FEISHU_CRITICAL_WEBHOOK_URL:-}
      FEISHU_CRITICAL_SECRET: ${FEISHU_CRITICAL_SECRET:-}
      FEISHU_AT_ALL_ON_CRITICAL: ${FEISHU_AT_ALL_ON_CRITICAL:-true}
      GRAFANA_EXTERNAL_URL: ${GRAFANA_EXTERNAL_URL:-}
      ALERTMANAGER_EXTERNAL_URL: ${ALERTMANAGER_EXTERNAL_URL:-}
      UPTIME_KUMA_EXTERNAL_URL: ${UPTIME_KUMA_EXTERNAL_URL:-}
      TZ: Asia/Shanghai
    networks:
      - monitoring-net
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8060/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.1
    container_name: mozia-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
    ports:
      - "${MONITORING_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3030}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: mozia-uptime-kuma
    restart: unless-stopped
    ports:
      - "${MONITORING_BIND_IP:-127.0.0.1}:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      TZ: Asia/Shanghai
    networks:
      - monitoring-net
    mem_limit: 512m

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  uptime_kuma_data:

networks:
  monitoring-net:
    driver: bridge
