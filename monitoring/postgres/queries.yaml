# Custom lightweight read-only PostgreSQL metrics for postgres_exporter.
# Requires pg_monitor role (granted by monitoring/postgres/init-monitor-user.sql).

pg_database_size:
  query: |
    SELECT
      datname,
      pg_database_size(datname) AS size_bytes
    FROM pg_database
    WHERE datistemplate = false;
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - size_bytes:
        usage: "GAUGE"
        description: "Disk space used by the database in bytes"

pg_stat_activity_max_tx:
  query: |
    SELECT
      datname,
      COALESCE(MAX(EXTRACT(EPOCH FROM (now() - xact_start))), 0) AS max_tx_duration
    FROM pg_stat_activity
    WHERE datname IS NOT NULL AND xact_start IS NOT NULL AND state <> 'idle'
    GROUP BY datname;
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - max_tx_duration:
        usage: "GAUGE"
        description: "Maximum active transaction duration in seconds"
